<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Willian dos Santos</title>
  <desc id="desc">Desenvolvimento de soluções digitais para gestão, produtividade e educação</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="52%" stop-color="#0D1726"/>
      <stop offset="100%" stop-color="#11102A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#20E3D2"/>
      <stop offset="52%" stop-color="#4F9CF9"/>
      <stop offset="100%" stop-color="#9B6DFF"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.12" cy="0.08" r="0.72">
      <stop offset="0%" stop-color="#20E3D2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#20E3D2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.9" cy="0.85" r="0.7">
      <stop offset="0%" stop-color="#9B6DFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#9B6DFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="rounded">
      <rect x="0" y="0" width="1200" height="320" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowCyan)"/>
    <rect width="1200" height="320" fill="url(#glowPurple)"/>

    <circle cx="1040" cy="70" r="135" fill="none" stroke="url(#accent)" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="1040" cy="70" r="96" fill="none" stroke="url(#accent)" stroke-opacity="0.28" stroke-width="1.5"/>
    <circle cx="1040" cy="70" r="58" fill="none" stroke="url(#accent)" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="1040" cy="70" r="9" fill="#20E3D2" filter="url(#softGlow)"/>
    <circle cx="1040" cy="70" r="4.5" fill="#FFFFFF"/>

    <path d="M870 245 C970 172 1072 195 1200 128" fill="none" stroke="url(#accent)" stroke-opacity="0.24" stroke-width="2"/>
    <path d="M900 278 C1005 205 1110 232 1200 186" fill="none" stroke="url(#accent)" stroke-opacity="0.12" stroke-width="1.5"/>

    <rect x="64" y="55" width="82" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="64" y="121" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1">Willian dos Santos</text>
    <text x="66" y="163" fill="#A7B5C8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="400">Tecnologia aplicada a problemas reais de gestão e produtividade</text>

    <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4">
      <rect x="64" y="206" width="152" height="38" rx="19" fill="#20E3D2" fill-opacity="0.1" stroke="#20E3D2" stroke-opacity="0.4"/>
      <text x="140" y="230" fill="#70F4E8" text-anchor="middle">PRODUTO DIGITAL</text>

      <rect x="228" y="206" width="126" height="38" rx="19" fill="#4F9CF9" fill-opacity="0.1" stroke="#4F9CF9" stroke-opacity="0.4"/>
      <text x="291" y="230" fill="#82BBFF" text-anchor="middle">AUTOMAÇÃO</text>

      <rect x="366" y="206" width="74" height="38" rx="19" fill="#9B6DFF" fill-opacity="0.1" stroke="#9B6DFF" stroke-opacity="0.45"/>
      <text x="403" y="230" fill="#BE9EFF" text-anchor="middle">IA</text>

      <rect x="452" y="206" width="92" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="498" y="230" fill="#DCE5F2" text-anchor="middle">GESTÃO</text>
    </g>

    <rect x="0" y="314" width="1200" height="6" fill="url(#accent)"/>
  </g>
</svg>